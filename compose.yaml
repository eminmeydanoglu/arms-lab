services:
  sim:
    build:
      context: .
    image: arms-lab:local
    network_mode: host
    environment:
      DISPLAY: ${DISPLAY:-}
      QT_X11_NO_MITSHM: "1"
      ARMS_LAB_HEADLESS: ${ARMS_LAB_HEADLESS:-}
      ARMS_LAB_DEVICE: ${ARMS_LAB_DEVICE:-}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    stdin_open: true
    tty: true
