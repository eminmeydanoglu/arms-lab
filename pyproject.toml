[project]
name = "arms-lab"
version = "0.1.0"
description = "Bimanual SO-101 simulation environment using Genesis and ROS 2"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "genesis-world==1.3.1",
  "numpy>=1.26.4,<3",
  "pyyaml>=6.0,<7",
  "torch>=2.5,<3",
]

[dependency-groups]
dev = [
  "pytest>=8.0,<9",
  "ruff>=0.12,<1",
]

[project.scripts]
arms-lab = "so101_sim.runner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/so101_sim"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
